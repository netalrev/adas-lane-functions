# conf/model/detector.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Configuration for TargetDetector (YOLOv8n ONNX).
#
# Merged under cfg.perception.detector via config.yaml defaults list.
#
# CLI override examples:
#   perception.detector.confidence_threshold=0.5
#   perception.detector.occlusion_iou_threshold=0.7

# Path to the YOLOv8n ONNX file.
# Run scripts/download_models.py once to generate this file.
# Exported with opset 12 (compatible with torch 1.12.x and onnxruntime ≥ 1.10).
onnx_path: src/data/models/yolov8n.onnx

# Input resolution fed to the model (must match the export imgsz).
input_size: 640

# Minimum per-class confidence score to keep a detection.
# Lowered to 0.25 to show all network outputs with minimal filtering.
confidence_threshold: 0.25

# IoU threshold for Non-Maximum Suppression (NMS) at the detector output.
# Same-class duplicate boxes above this overlap are collapsed to the highest-
# confidence box.  Standard value for YOLOv8.
nms_iou_threshold: 0.45

# COCO class IDs to retain.  Empty list = accept all 80 COCO classes.
# 0=person  1=bicycle  2=car  3=motorcycle  5=bus  7=truck
class_whitelist: []

# ONNX Runtime execution providers (in priority order).
# CUDAExecutionProvider is tried first; ONNX Runtime silently falls back to
# CPUExecutionProvider if no compatible GPU / CUDA toolkit is found.
providers:
  - CUDAExecutionProvider
  - CPUExecutionProvider
